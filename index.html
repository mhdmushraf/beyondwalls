  <body>
    <div id="bw-splash" aria-hidden="true" style="position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% 40%,#2a1470 0%,rgba(42,20,112,0) 60%),linear-gradient(151deg,#140b3a 14%,#0d0a1f 54%,#2a0f6b 86%);font-family:Inter,system-ui,-apple-system,sans-serif;transition:opacity .45s ease,visibility .45s ease">
      <style>
        @keyframes bwIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
        @keyframes bwGlow{0%,100%{box-shadow:0 24px 70px rgba(111,63,253,.45),0 0 0 0 rgba(139,107,255,.35)}50%{box-shadow:0 24px 90px rgba(111,63,253,.7),0 0 0 16px rgba(139,107,255,0)}}
        @keyframes bwPlay{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
        @keyframes bwBar{0%{left:-40%}100%{left:100%}}
        #bw-splash .t{animation:bwIn .6s ease both}
        #bw-splash.out{opacity:0;visibility:hidden}
      </style>
      <div class="t" style="width:96px;height:96px;border-radius:26px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7c4dff 0%,#5a2ded 75%);animation:bwIn .6s ease both,bwGlow 2.2s ease-in-out .6s infinite">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2.2"/><path d="M12 17v4"/><path d="M8 21h8"/><path style="animation:bwPlay 1.2s ease-in-out infinite" fill="#fff" d="M10 7.75a.75.75 0 0 1 1.142-.638l3.664 2.249a.75.75 0 0 1 0 1.278l-3.664 2.25a.75.75 0 0 1-1.142-.64z"/></svg>
      </div>
      <div class="t" style="margin-top:22px;color:#fff;font-weight:800;font-size:34px;letter-spacing:-.03em;animation-delay:.12s">BeyondWalls</div>
      <div class="t" style="margin-top:6px;color:#bdb6e3;font-size:15px;font-weight:500;animation-delay:.22s">Your screen runs your shop. Then it pays you.</div>
      <div class="t" style="position:relative;margin-top:28px;width:140px;height:4px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;animation-delay:.3s"><div style="position:absolute;top:0;bottom:0;width:40%;border-radius:99px;background:linear-gradient(90deg,#8b6bff,#c4b5fd);animation:bwBar 1.1s ease-in-out infinite"></div></div>
      <div class="t" style="position:absolute;bottom:40px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;animation-delay:.45s">
        <div style="color:#fff;font-size:17px;font-weight:600;letter-spacing:-.01em"><span style="color:#a39bd0;font-weight:500">A</span> Linkzone Global <span style="color:#a39bd0;font-weight:500">company</span></div>
        <div style="color:#6f6896;font-size:11px">Dubai Internet City · UAE</div>
      </div>
    </div>
    <script>
      (function () {
        var p = location.pathname.toLowerCase();
        var el = document.getElementById('bw-splash');
        if (/^\/(player|q\/|screenplayer)/.test(p)) { el && el.remove(); return; }
        var seen = false; try { seen = sessionStorage.getItem('bw_splash') === '1'; sessionStorage.setItem('bw_splash', '1'); } catch (e) {}
        window.__bwSplashMin = seen ? 700 : 2400;
      })();
    </script>
    <div id="root"></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
