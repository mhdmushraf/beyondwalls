<mjml>
  <mj-head>
    <mj-title>{{business_name}}: your Beyond Walls review</mj-title>
    <mj-preview>We have reviewed your Beyond Walls application.</mj-preview>
    <mj-attributes>
      <mj-all font-family="Inter, Arial, sans-serif" />
      <mj-section background-color="#ffffff" padding="0 36px" />
      <mj-text color="#475569" font-size="15px" line-height="1.6" padding="0" />
      <mj-button background-color="#5a2ded" color="#ffffff" border-radius="6px" font-weight="700" inner-padding="14px 28px" align="left" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#ffffff">
    <mj-section background-color="#5a2ded" padding="20px 36px">
      <mj-column>
        <mj-text color="#000000" font-size="16px" font-weight="700" padding="0">
          <img src="https://media.base44.com/images/public/69b31183956b052c51ee3a67/b64097b04_beyondwalls-icon.png" alt="Beyond Walls" width="28" height="28" style="vertical-align:middle;border-radius:6px;" />
          &nbsp;Beyond Walls
        </mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="36px 36px 8px">
      <mj-column>
        <mj-text font-size="28px" font-weight="700" color="#0f172a" line-height="1.2" padding="0">
          {{business_name}} is {{decision}}
        </mj-text>
        <mj-text padding="12px 0 0" color="#64748b">{{message}}</mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="20px 36px">
      <mj-column>
        <mj-text padding="0" font-size="14px" color="#475569">{{reason}}</mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="4px 36px 36px">
      <mj-column>
        <mj-button href="{{action_url}}">Open your dashboard</mj-button>
      </mj-column>
    </mj-section>

    <mj-section background-color="#f8fafc" padding="24px 36px">
      <mj-column>
        <mj-text font-size="12px" color="#94a3b8" padding="0">
          Beyond Walls · Dubai · You are receiving this because you applied for a business account.
        </mj-text>
      </mj-column>
    </mj-section>
  </mj-body>
</mjml>
